# Project settings. Secrets (the Gemini key) live in .env, not here.
# Paths are relative to the repo root.

llm:
  # mock:   offline keyword rules, for tests and development (results are not real)
  # gemini: Google Gemini API, needs GEMINI_API_KEY in .env (free tier)
  # ollama: a local model served by Ollama (https://ollama.com); no key, nothing leaves the machine
  # openai: OpenAI API, needs OPENAI_API_KEY in .env; in the app only Gemini's fallback
  # LLM_PROVIDER in .env overrides this.
  provider: gemini
  # Model that judges disputes (agent, baseline, message drafts), per provider.
  # GEMINI_MODEL, OLLAMA_MODEL and OPENAI_MODEL in .env override these.
  # reports/model_comparison.md explains why these models (Gemini and the local ones;
  # OpenAI is a fallback only and was not part of the comparison).
  judge_models:
    gemini: gemini-flash-lite-latest
    ollama: llama3.1:8b
    openai: gpt-5.4-mini
  # In the app, a failed call to the provider on the left goes to the one on the
  # right, if its key is set: Gemini first, OpenAI when Gemini's free quota runs out
  # or Gemini is down. Our OpenAI key is on OpenAI's free usage tier (unpaid, about
  # 50 requests a day per model). Evaluations never fall back.
  fallback:
    gemini: openai
  openai:
    # gpt-5 models are reasoning models: low effort keeps time per call down.
    reasoning_effort: low
  ollama:
    host: http://localhost:11434
    # Context window in tokens. The baseline prompt holds the whole policy
    # (up to 6,800 tokens), more than Ollama's default window. A larger window
    # does not fit an 8B model entirely on an 8 GB GPU and slows it down.
    num_ctx: 10240
    timeout_seconds: 600
  # Models that write the synthetic disputes, tried in order (the next one is
  # used when one runs out of free quota). Kept different from the judge so the
  # same model is not grading its own writing. The 180 generated cases came from
  # gemma-4-26b-a4b-it (154), gemini-3-flash-preview (19) and gemini-3.5-flash (7;
  # used on 28 Oct until its small daily quota ran out). Each case records its
  # generator in meta.generator_model.
  generator_model:
    - gemini-3-flash-preview
    - gemma-4-26b-a4b-it
  temperature: 0.0
  generator_temperature: 0.9
  # Free-tier friendly pacing: wait at least this long between calls.
  min_seconds_between_calls: 4.5
  # Per-minute 429s that ask us to wait up to this long are retried in place.
  # Longer waits (or daily quota) stop the run so it can resume later.
  max_retry_wait_seconds: 90

rag:
  policy_dir: data/policy
  persist_dir: .chroma
  collection: carousell_sg_policy
  # dense (embeddings only), lexical (BM25 only) or hybrid (both, rank-fused)
  mode: hybrid
  # Clauses retrieved per query; each claim gap gets its own query.
  top_k: 3
  # Upper bound on clauses handed to the judge after merging all queries.
  max_clauses: 8
  chunk_max_chars: 900
  chunk_min_chars: 300

agent:
  # Recommendations below this confidence are escalated for careful review.
  confidence_threshold: 0.7
  # The judge may call the search_policy tool when the retrieved clauses do not
  # cover a gap. Rounds: how many times it may search before it must decide.
  max_tool_rounds: 1
  max_searches_per_round: 2

# Cost-based check of the escalation threshold: `uv run dispute-agent review-cost`
# writes reports/review_cost.md. Every recommendation is checked by a person: a
# confident one gets a standard review, an escalated one a careful review (staff
# decide it from scratch). A wrong recommendation that a standard review lets
# through costs rework and money moved wrongly. The analysis prices all three
# and finds the threshold with the lowest cost per dispute.
# Low / base / high match the business case (report section 9.2).
review_cost:
  staff_cost_per_hour:
    {low: 26, base: 35, high: 45, source: "MOM 2025 median for a customer service officer, plus CPF, 13th month and overheads (section 9.2)"}
  careful_review_minutes:
    {low: 30, base: 45, high: 60, source: "Staff time to decide a dispute by hand; vendor estimate of 30-60 min (Chargeflow, section 9.2)"}
  time_saved_by_agent:
    {low: 0.4, base: 0.5, high: 0.6, source: "Assumption (section 9.2): a standard review of a confident recommendation takes the rest of a careful review's time"}
  order_value:
    {low: 60, base: 100, high: 120, source: "Average 'Buy' order in S$, assumption (section 9.2)"}
  disputes_per_year:
    {low: 1440, base: 6000, high: 28000, source: "Disputes escalated to Carousell staff a year in Singapore (section 9.3); turns a cost per dispute into a cost per year"}
  # Labels give the outcome, not the amount, so a partial refund that was due
  # counts as this share of the order. Gemini's partial refunds in the test and
  # dev runs: median 15%, mean 23%.
  partial_refund_share: 0.2
  # Paid-tier price of gemini-3.5-flash-lite (the judge alias on 5 Nov 2026), US$
  # per million tokens. Tokens per case are measured from the runs.
  llm_price_per_million: {input: 0.30, output: 2.50}
  # Candidate thresholds: a recommendation is escalated when its confidence is
  # below the threshold (and still for the review gate's other reasons).
  thresholds: [0.5, 0.6, 0.7, 0.8, 0.85, 0.9, 0.95, 1.0]
  # The threshold is chosen on dev cases only and checked on the test set.
  # dev_borderline_v2 is the 36 borderline dev cases after the decision-guide
  # fix; gemini_seed holds the hand-written seed cases (its test cases are left out).
  tune_runs: [dev_borderline_v2, gemini_seed]
  check_runs: [cmp_gemini-flash-lite]
  # Resamples of the dev cases, to show how often each threshold comes out cheapest.
  bootstrap: 2000

data:
  mercari_archive: data/raw/train.tsv.7z
  mercari_tsv: data/raw/train.tsv
  listings_sample: data/listings/listings_sample.jsonl
  sample_size: 300
  # Mercari prices are in USD; converted at this fixed rate for a Singapore setting.
  usd_to_sgd: 1.35
  seed: 3415
  seed_cases: data/cases/seed_cases.yaml
  generated_cases: data/cases/generated_cases.jsonl
  splits: data/cases/splits.json
  test_size: 50
  labels: data/labels/labels.csv
  retrieval_queries: data/eval/retrieval_queries.jsonl

generation:
  # Total number of cases, including the 20 hand-written seed cases
  # (200 = 20 seed + 180 generated). The generator writes only the difference.
  # Mix follows the brief: 60% clear, 30% borderline, 10% ineligible.
  target_total: 200
  mix:
    clear: 0.6
    borderline: 0.3
    ineligible: 0.1

outputs:
  runs_dir: outputs/runs
  decision_log: outputs/decision_log.jsonl
  whatif_dir: outputs/whatif
  reports_dir: reports
