[project]
name = "dispute-agent"
version = "0.1.0"
description = "AI agent that helps Carousell Singapore support staff settle 'significantly not as described' disputes"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph>=1.0",
    "chromadb>=1.0",
    "streamlit>=1.40",
    "google-genai>=1.50",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "py7zr>=0.22",
]

[project.scripts]
dispute-agent = "dispute_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dispute_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
