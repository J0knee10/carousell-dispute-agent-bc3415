- case_id: S10
  listing_id: L0039
  order: {payment_method: PayNow, delivery_method: tracked_mail, order_confirmed_at: 2026-10-06T10:00, delivered_at: 2026-10-09T12:00}
  dispute:
    reason: snad
    raised_at: 2026-10-10T09:00
    buyer_complaint: "Seller said great condition but there is pilling all over the sleeves and under the arms. It looks worn."
    buyer_proposed_resolution: partial_refund
    buyer_requested_refund_sgd: 15
    buyer_photo_descriptions:
      - "Sleeve showing small fabric pills along the forearm"
      - "Underarm area with light pilling"
    seller_response: "I mentioned the slight pilling in the description and showed it in the last picture."
  chat:
    - {sender: buyer, text: "There's a lot of pilling"}
    - {sender: seller, text: "Yes, that's in the listing and the last photo"}
  meta: {difficulty: borderline, scenario: wear_disclosed, target_outcome: decline, demo: true,
         notes: "Wear was disclosed and the item was listed as used; the buyer thinks it is worse than expected."}

- case_id: S11
  listing_id: L0044
  order: {payment_method: PayNow, delivery_method: tracked_mail, order_confirmed_at: 2026-10-11T15:00, delivered_at: 2026-10-14T11:00}
  dispute:
    reason: snad
    raised_at: 2026-10-14T19:00
    buyer_complaint: "The colour is described as Blue Lotus but in person it looks much more teal-green than blue. Not what I expected from the photos."
