- case_id: S16
  listing_id: L0132
  order: {paid_via_buy_button: false, payment_method: Bank transfer, delivery_method: tracked_mail, order_confirmed_at: 2026-10-07T12:00, delivered_at: 2026-10-10T15:00}
  dispute:
    reason: snad
    raised_at: 2026-10-10T20:00
    buyer_complaint: "Two of the discs in the Seiryu box won't play at all, the player says it can't read them. Listing said it plays well."
    buyer_proposed_resolution: return_and_refund
    buyer_photo_descriptions:
      - "TV screen showing 'Disc cannot be read'"
    seller_response: "They played on my machine."
  chat:
    - {sender: buyer, text: "Transferred the money to your bank account, thanks"}
    - {sender: seller, text: "Received, will post tomorrow"}
    - {sender: buyer, text: "Two discs don't work"}
  meta: {difficulty: ineligible, scenario: off_platform_payment, target_outcome: decline, target_eligible: false, demo: true,
         notes: "Complaint might be valid, but payment was a bank transfer outside the 'Buy' button, so Buyer Protection does not apply."}

