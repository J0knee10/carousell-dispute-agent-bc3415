# Hand-written dispute cases built on real listings from listings_sample.jsonl.
#
# Each case names a listing by listing_id; the listing text is pulled in from the
# sample, so only the order, dispute and chat are written here. `meta` holds the
# outcome the author intended (the provisional label) and why.
#
# Field reference: src/dispute_agent/schemas.py (Order, Dispute, CaseMeta).
# Times are Singapore local time.

- case_id: S01
  listing_id: L0080
  order: {payment_method: PayNow, delivery_method: tracked_mail, order_confirmed_at: 2026-10-05T10:00, delivered_at: 2026-10-08T14:00}
  dispute:
    reason: incomplete
    raised_at: 2026-10-09T09:30
    buyer_complaint: "The listing says it comes with an 8GB SD card and Need for Speed Most Wanted. The console and charger arrived but there is no SD card in the slot or anywhere in the box. Without the card I can't save games."
    buyer_proposed_resolution: partial_refund
    buyer_requested_refund_sgd: 25
    buyer_photo_descriptions:
      - "Opened parcel showing the PS Vita, a generic charger and the game cartridge"
      - "Close-up of the empty memory card slot on the console"
    seller_response: "I'm sure I put everything in. Maybe it fell out in the bubble wrap?"
    seller_counter_proposal: "Refund $10"
  chat:
    - {sender: buyer, text: "Hi, got the Vita today, thanks. The SD card isn't inside though?"}
    - {sender: seller, text: "Should be in the slot. Check the bubble wrap"}
    - {sender: buyer, text: "Checked everything, it's not there. Photos attached."}
  meta: {difficulty: clear, scenario: missing_accessory, target_outcome: partial_refund, demo: true,
         notes: "Accessory explicitly promised in the listing is missing; console itself works."}

- case_id: S02
  listing_id: L0089
  order: {payment_method: Visa/Mastercard, delivery_method: tracked_mail, order_confirmed_at: 2026-10-10T20:15, delivered_at: 2026-10-13T11:00}
  dispute:
    reason: snad
    raised_at: 2026-10-13T21:00
    buyer_complaint: "Listing says 64GB iPhone 6. Settings shows 16GB capacity and the model number on the back matches the 16GB version. I paid for 64GB."
    buyer_proposed_resolution: return_and_refund
    buyer_photo_descriptions:
      - "Screenshot of Settings > General > About showing Capacity 16 GB"
      - "Back of the phone showing the model number"
    seller_response: "It was sold to me as 64GB, I never checked. It works fine though."
    seller_counter_proposal: "Refund $40 and you keep it"
  chat:
    - {sender: buyer, text: "The phone is 16GB not 64GB, see screenshot"}
    - {sender: seller, text: "Oh I didn't know. I can give some money back"}
    - {sender: buyer, text: "I need the 64GB, I'd rather return it"}
  meta: {difficulty: clear, scenario: wrong_variation, target_outcome: full_refund_with_return, demo: true,
         notes: "Different version (storage) from what was listed."}

- case_id: S03
  listing_id: L0042
  order: {payment_method: PayNow, delivery_method: tracked_mail, order_confirmed_at: 2026-10-02T13:00, delivered_at: 2026-10-06T10:30}
  dispute:
    reason: snad
    raised_at: 2026-10-07T08:00
    buyer_complaint: "Listing says the phone is in perfect shape. It switches off by itself every few minutes even at 100% battery and restarts in a loop. Tried two chargers."
    buyer_proposed_resolution: return_and_refund
    buyer_photo_descriptions:
      - "Video description: phone powers off on its own while on the home screen at 100% battery"
    seller_response: "It was working when I packed it. Maybe something happened in shipping."
    seller_evidence:
      - "Photo of the phone switched on, taken before shipping"
  chat:
    - {sender: buyer, text: "Phone keeps turning off by itself, is this a known issue?"}
    - {sender: seller, text: "Never happened to me"}
  meta: {difficulty: clear, scenario: undisclosed_functional_defect, target_outcome: full_refund_with_return,
         notes: "Undisclosed defect affecting function; a photo of it switched on does not show it stays on."}

- case_id: S04
  listing_id: L0128
  order: {payment_method: DBS PayLah!, delivery_method: tracked_mail, order_confirmed_at: 2026-10-12T09:00, delivered_at: 2026-10-15T16:00}
  dispute:
    reason: incomplete
    raised_at: 2026-10-16T10:00
